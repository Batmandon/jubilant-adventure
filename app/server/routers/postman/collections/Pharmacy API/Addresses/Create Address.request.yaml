$kind: http-request
name: Create Address
method: POST
url: '{{base_url}}/addresses'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "line": "123 Main Street, Apartment 4B",
      "city": "Mumbai",
      "pincode": "400001",
      "phone": "9876543210"
    }
