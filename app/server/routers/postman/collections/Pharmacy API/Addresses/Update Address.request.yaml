$kind: http-request
name: Update Address
method: PUT
url: '{{base_url}}/addresses/{{address_id}}'
order: 3000
pathVariables:
  - key: address_id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "line": "456 New Street, Floor 2",
      "city": "Delhi",
      "pincode": "110001",
      "phone": "9876543210"
    }
