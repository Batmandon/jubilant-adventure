$kind: http-request
name: Update Product
method: PUT
url: '{{base_url}}/products/{{product_id}}'
order: 5000
pathVariables:
  - key: product_id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Paracetamol 500mg",
      "price": 55,
      "mrp": 65,
      "is_active": true
    }
