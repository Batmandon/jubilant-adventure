$kind: http-request
name: Register
method: POST
url: '{{base_url}}/auth_routes/register'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "first_name": "John",
      "last_name": "Doe",
      "email": "john@example.com",
      "phone": "9876543210",
      "password": "securepass123"
    }
