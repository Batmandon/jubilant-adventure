$kind: http-request
name: Edit Product Salt
method: PATCH
url: '{{base_url}}/product-salts/{{item_id}}'
order: 3000
pathVariables:
  - key: item_id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "product_id": 1,
      "salt_id": 2,
      "strength": "250mg"
    }
