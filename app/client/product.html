<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All Products | Shama Medical</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/product.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <!-- Breadcrumb Bar -->
    <div class="breadcrumb-container">
        <nav class="breadcrumb">
            <a href="index.html">Home</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>Shop All</span>
        </nav>
    </div>

    <!-- Main Catalog Container -->
    <main class="shop-container">
        <!-- Main Products Section -->
        <section class="products-section">

            <!-- Header: Title, Count & Sort Dropdown -->
            <div class="products-header">
                <div>
                    <h1 class="catalog-title" id="page-title">Shop All Products</h1>
                    <span class="catalog-count" id="result-text" aria-live="polite">Loading products...</span>
                </div>

                <div class="sort-wrapper">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select" class="sort-dropdown">
                        <option value="popularity">Popularity</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="newest">Newest Arrivals</option>
                    </select>
                </div>
            </div>

            <!-- Products Grid (3 Columns) -->
            <div class="catalog-grid" id="product-grid" aria-live="polite"></div>
            <section class="catalog-empty-state" id="empty-state" hidden>
                <h2>No products found</h2>
                <p>There are no products available right now.</p>
            </section>
            <nav class="catalog-pagination" id="pagination" aria-label="Product pages" hidden></nav>

        </section>

    </main>
    <div id="footer-placeholder"></div>
    <script src="js/config.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/catalog.js" defer></script>
</body>

</html>
