<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All Products | Shama Medical</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/product.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <!-- Breadcrumb Bar -->
    <div class="breadcrumb-container">
        <nav class="breadcrumb">
            <a href="index.html">Home</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>Shop All</span>
        </nav>
    </div>

    <!-- Main Catalog Container Grid -->
    <main class="shop-container">

        <!-- Sidebar Filters (Aside Column) -->
        <aside class="sidebar-filters">

            <!-- Header with Title & Filter Icon -->
            <div class="filter-header">
                <h1 class="filter-title">Filters</h1>
                <div class="filter-icon-box">
                    <i class="fa-solid fa-sliders"></i>
                </div>
            </div>

            <!-- 1. Category Filter Group -->
            <div class="filter-group">
                <h2 class="filter-group-title">Category</h2>
                <div class="filter-options-vertical">
                    <label class="filter-checkbox"><input type="checkbox"> <span>Prescription (Rx)</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Over-the-Counter (OTC)</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Vitamins &amp;
                            Supplements</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Baby Care</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Personal Care</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Medical Devices</span></label>
                </div>
            </div>

            <!-- 2. Price Range Range-Slider Group -->
            <div class="filter-group">
                <h2 class="filter-group-title">Price Range</h2>
                <div class="price-slider-wrapper">
                    <input type="range" min="0" max="100" value="75" class="price-slider">
                    <div class="price-labels">
                        <span>₹0</span>
                        <span>₹100+</span>
                    </div>
                </div>
            </div>

            <!-- 3. Brand Filter Group (2 Columns) -->
            <div class="filter-group">
                <h2 class="filter-group-title">Brand</h2>
                <div class="filter-options-grid">
                    <label class="filter-checkbox"><input type="checkbox"> <span>GSK</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Cipla</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Pfizer</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>HealWell</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Bayer</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Sun Pharma</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Sandoz</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>More...</span></label>
                </div>
            </div>

            <!-- 4. Form/Dosage Type Filter Group (2 Columns) -->
            <div class="filter-group">
                <h2 class="filter-group-title">Form</h2>
                <div class="filter-options-grid">
                    <label class="filter-checkbox"><input type="checkbox"> <span>Tablet</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Powder</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Syrup</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Proteins</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Injection</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Drops</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Capsule</span></label>
                    <label class="filter-checkbox"><input type="checkbox"> <span>Ointment</span></label>
                </div>
            </div>

        </aside>

        <!-- Main Products Section -->
        <section class="products-section">

            <!-- Header: Title, Count & Sort Dropdown -->
            <div class="products-header">
                <div>
                    <h1 class="catalog-title" id="page-title">Shop All Products</h1>
                    <span class="catalog-count" id="result-text" aria-live="polite">Loading products...</span>
                </div>

                <div class="sort-wrapper">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select" class="sort-dropdown">
                        <option value="popularity">Popularity</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="newest">Newest Arrivals</option>
                    </select>
                </div>
            </div>

            <!-- Products Grid (3 Columns) -->
            <div class="catalog-grid" id="product-grid" aria-live="polite"></div>
            <section class="catalog-empty-state" id="empty-state" hidden>
                <h2>No products found</h2>
                <p>There are no products available right now.</p>
            </section>
            <nav class="catalog-pagination" id="pagination" aria-label="Product pages" hidden></nav>

        </section>

    </main>
    <div id="footer-placeholder"></div>
    <script src="js/config.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/catalog.js" defer></script>
</body>

</html>
