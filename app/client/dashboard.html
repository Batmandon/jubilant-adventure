<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Shama Medical</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/components.css">
    
</head>
<body>

  <div id="navbar-placeholder"></div>


  <div class="admin">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-staff-snake" aria-hidden="true"></i> Shama Medical <span>Admin</span></div>

      <nav class="nav" id="nav" aria-label="Dashboard sections">
        <button type="button" class="nav-item active" data-view="overview">
          <i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>Overview</span>
        </button>
        <button type="button" class="nav-item" data-view="products">
          <i class="fa-solid fa-pills" aria-hidden="true"></i><span>Products</span>
        </button>
      </nav>

      <button type="button" class="nav-item nav-logout" id="logout-btn">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i><span>Logout</span>
      </button>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">

      <header class="topbar">
        <h1 id="view-title">Overview</h1>
        <p class="muted" id="admin-name"></p>
      </header>

      <div id="page-message" class="form-message" role="alert"></div>

      <!-- ===== OVERVIEW ===== -->
      <section id="view-overview">

        <div class="tiles">
          <div class="tile">
            <span class="tile-label">Today's orders</span>
            <strong class="tile-value" id="stat-today">–</strong>
          </div>
          <div class="tile">
            <span class="tile-label">Pending orders</span>
            <strong class="tile-value" id="stat-pending">–</strong>
          </div>
          <div class="tile">
            <span class="tile-label">Revenue (delivered)</span>
            <strong class="tile-value" id="stat-revenue">–</strong>
          </div>
          <div class="tile">
            <span class="tile-label">Active products</span>
            <strong class="tile-value" id="stat-active-products">–</strong>
          </div>
        </div>

        <section class="card">
          <h2 class="card-title">Recent orders</h2>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Order</th>
                  <th scope="col">Customer</th>
                  <th scope="col">Date</th>
                  <th scope="col" class="num">Total</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="recent-orders-body"></tbody>
            </table>
          </div>
          <p class="empty" id="recent-orders-empty" hidden>No orders yet.</p>
        </section>

      </section>

      <!-- ===== PRODUCTS ===== -->
      <section id="view-products" hidden>

        <div class="toolbar">
          <input type="search" id="product-search" class="input" placeholder="Search by name, brand or category" maxlength="100" aria-label="Search products">
          <button type="button" class="btn btn-primary" id="add-product-btn">
            <i class="fa-solid fa-plus" aria-hidden="true"></i> Add product
          </button>
        </div>

        <section class="card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">Category</th>
                  <th scope="col" class="num">Stock</th>
                  <th scope="col">Status</th>
                  <th scope="col"><span class="sr-only">Actions</span></th>
                </tr>
              </thead>
              <tbody id="product-body"></tbody>
            </table>
          </div>
          <p class="empty" id="product-empty" hidden>No products found.</p>

          <div class="pager">
            <button type="button" class="btn btn-ghost btn-sm" id="page-prev">Previous</button>
            <span class="muted" id="page-info"></span>
            <button type="button" class="btn btn-ghost btn-sm" id="page-next">Next</button>
          </div>
        </section>

      </section>

    </main>
  </div>

  <!-- ===== Row templates (JS clones these) ===== -->
  <template id="recent-order-row">
    <tr>
      <td data-f="id"></td>
      <td data-f="customer"></td>
      <td data-f="date"></td>
      <td data-f="total" class="num"></td>
      <td><span class="status" data-f="status"></span></td>
    </tr>
  </template>

  <template id="product-row">
    <tr>
      <td>
        <div class="cell-name" data-f="name"></div>
        <div class="cell-sub" data-f="sub"></div>
      </td>
      <td data-f="category"></td>
      <td class="num" data-f="stock"></td>
      <td><span class="status" data-f="status"></span></td>
      <td class="actions">
        <button type="button" class="icon-btn" data-action="edit" aria-label="Edit product"><i class="fa-solid fa-pen" aria-hidden="true"></i></button>
        <button type="button" class="icon-btn danger" data-action="delete" aria-label="Delete product"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
      </td>
    </tr>
  </template>

  <template id="salt-row">
    <div class="salt-row">
      <input type="text" class="input" data-f="salt-name" placeholder="Salt name" maxlength="100" aria-label="Salt name">
      <input type="text" class="input" data-f="salt-strength" placeholder="Strength" maxlength="20" aria-label="Salt strength">
      <button type="button" class="icon-btn danger" data-action="remove-salt" aria-label="Remove salt"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
  </template>

  <!-- ===== Product dialog (add / edit) ===== -->
  <dialog id="product-dialog" class="dialog" aria-labelledby="product-dialog-title">
    <form id="product-form" class="dialog-body" novalidate>
      <div class="dialog-head">
        <h3 id="product-dialog-title">Add product</h3>
        <button type="button" class="icon-btn" data-close aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>

      <div id="product-message" class="form-message" role="alert"></div>

      <fieldset data-group="product">
        <legend>Product</legend>

        <div class="grid-2">
          <div class="field"><label for="p-name">Name</label>
            <input type="text" id="p-name" name="name" class="input" maxlength="20" autofocus><small class="error"></small></div>
          <div class="field"><label for="p-category">Category</label>
            <input type="text" id="p-category" name="category" class="input" maxlength="30"><small class="error"></small></div>
        </div>

        <div class="grid-2">
          <div class="field"><label for="p-manufacturer">Manufacturer</label>
            <input type="text" id="p-manufacturer" name="manufacturer" class="input" maxlength="100"><small class="error"></small></div>
          <div class="field"><label for="p-strength">Strength</label>
            <input type="text" id="p-strength" name="strength" class="input" placeholder="e.g. 650mg" maxlength="20"><small class="error"></small></div>
        </div>

        <div class="grid-3">
          <div class="field"><label for="p-form">Form</label>
            <select id="p-form" name="form" class="input">
              <option value="">Select</option>
              <option>Tablet</option><option>Capsule</option><option>Syrup</option><option>Suspension</option>
              <option>Injection</option><option>Ointment</option><option>Cream</option><option>Gel</option>
              <option>Drops</option><option>Powder</option><option>Inhaler</option><option>Lotion</option><option>Other</option>
            </select><small class="error"></small></div>
          <div class="field"><label for="p-pack-size">Pack size</label>
            <input type="text" id="p-pack-size" name="pack_size" class="input" placeholder="e.g. 15 tablets" maxlength="20"><small class="error"></small></div>
          <div class="field"><label for="p-schedule">Schedule</label>
            <select id="p-schedule" name="schedule" class="input">
              <option value="">Select</option>
              <option>OTC</option><option>H</option><option>H1</option><option>X</option>
            </select><small class="error"></small></div>
        </div>

        <div class="grid-2">
          <div class="field"><label for="p-gst">GST %</label>
            <input type="number" id="p-gst" name="gst_percent" class="input" min="0" max="99.99" step="0.01"><small class="error"></small></div>
          <div class="field"><label for="p-hsn">HSN code</label>
            <input type="text" id="p-hsn" name="hsn_code" class="input" maxlength="20"><small class="error"></small></div>
        </div>

        <div class="field"><label for="p-storage">Storage condition</label>
          <input type="text" id="p-storage" name="storage_condition" class="input" maxlength="100"><small class="error"></small></div>

        <div class="field"><label for="p-description">Description</label>
          <textarea id="p-description" name="description" class="input" rows="3" maxlength="500"></textarea><small class="error"></small></div>

        <div class="field"><label for="p-image">Image URL</label>
          <input type="url" id="p-image" name="image_url" class="input" maxlength="200"><small class="error"></small></div>

        <div class="field">
          <label>Salts</label>
          <div id="salt-list" class="salt-list"></div>
          <small class="error" id="salts-error"></small>
          <button type="button" class="btn btn-outline btn-sm" id="add-salt-btn"><i class="fa-solid fa-plus" aria-hidden="true"></i> Add salt</button>
        </div>
      </fieldset>

      <fieldset data-group="batch">
        <legend id="batch-legend">First batch</legend>

        <!-- Edit mode only: choose which batch to edit -->
        <div class="field" id="batch-picker-wrap" hidden>
          <label for="batch-select">Batch to edit</label>
          <select id="batch-select" class="input"></select>
        </div>

        <div class="grid-2">
          <div class="field"><label for="b-no">Batch number</label>
            <input type="text" id="b-no" name="batch_no" class="input" maxlength="100"><small class="error"></small></div>
          <div class="field"><label for="b-qty">Quantity</label>
            <input type="number" id="b-qty" name="quantity" class="input" min="0" step="1"><small class="error"></small></div>
        </div>

        <div class="grid-2">
          <div class="field"><label for="b-mfg">Mfg date <span class="opt">(optional)</span></label>
            <input type="date" id="b-mfg" name="mfg_date" class="input"><small class="error"></small></div>
          <div class="field"><label for="b-exp">Expiry date</label>
            <input type="date" id="b-exp" name="expiry_date" class="input"><small class="error"></small></div>
        </div>

        <div class="grid-3">
          <div class="field"><label for="b-purchase">Purchase price</label>
            <input type="number" id="b-purchase" name="purchase_price" class="input" min="0" step="0.01"><small class="error"></small></div>
          <div class="field"><label for="b-mrp">MRP</label>
            <input type="number" id="b-mrp" name="mrp" class="input" min="0" step="0.01"><small class="error"></small></div>
          <div class="field"><label for="b-discount">Discount %</label>
            <input type="number" id="b-discount" name="discount_percent" class="input" min="0" max="100" step="0.01" value="0"><small class="error"></small></div>
        </div>

        <div class="grid-2">
          <div class="field"><label for="b-supplier">Supplier ID <span class="opt">(optional)</span></label>
            <input type="number" id="b-supplier" name="supplier_id" class="input" min="1" step="1"><small class="error"></small></div>
          <div class="field"><label for="b-rack">Rack location <span class="opt">(optional)</span></label>
            <input type="text" id="b-rack" name="rack_location" class="input" maxlength="100"><small class="error"></small></div>
        </div>
      </fieldset>

      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="product-save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- ===== Confirm dialog (delete, logout) ===== -->
  <dialog id="confirm-dialog" class="dialog dialog-small" aria-labelledby="confirm-title">
    <form method="dialog" class="dialog-body">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-text" class="muted"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" value="confirm" class="btn btn-danger">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="footer-placeholder"></div>
  <script src="js/components.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/dashboard.js defer"></script>
</body>
</html>
